{{ if .Error }}
<div class="result-box result-error mb-3">{{ .Error }}</div>
{{ end }}
{{ if .Message }}
<div class="result-box result-success mb-3">{{ .Message }}</div>
{{ end }}

<div class="overflow-x-auto">
{{ if .Antirequisites }}
<table class="w-full text-sm">
  <thead>
    <tr class="border-b" style="border-color: var(--border);">
      <th class="pb-2 pr-4 text-left text-xs font-semibold uppercase tracking-wide hint">Code</th>
      <th class="pb-2 pr-4 text-left text-xs font-semibold uppercase tracking-wide hint">Name</th>
      <th class="pb-2 text-right text-xs font-semibold uppercase tracking-wide hint">Action</th>
    </tr>
  </thead>
  <tbody>
    {{ range .Antirequisites }}
    <tr class="border-b" style="border-color: var(--border);">
      <td class="py-1.5 pr-4"><code>{{ .Code }}</code></td>
      <td class="py-1.5 pr-4">{{ .Name }}</td>
      <td class="py-1.5 text-right">
        <form hx-post="/programs/antirequisites/remove" hx-target="#antirequisites-panel" hx-swap="innerHTML" style="display:inline;">
          <input type="hidden" name="program_id" value="{{ $.ProgramID }}">
          <input type="hidden" name="course_id" value="{{ .CourseID }}">
          <button type="submit" class="rounded border border-red-300 px-2 py-0.5 text-xs font-semibold text-red-700 hover:bg-red-50 dark:border-red-900 dark:text-red-300 dark:hover:bg-red-950">Remove</button>
        </form>
      </td>
    </tr>
    {{ end }}
  </tbody>
</table>
{{ else }}
<p class="hint text-sm">No antirequisites configured for this program.</p>
{{ end }}
</div>
